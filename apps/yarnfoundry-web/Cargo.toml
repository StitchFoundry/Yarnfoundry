[package]
name = "yarnfoundry-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "YarnFoundry in the browser (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
yarnfoundry-core = { workspace = true }
yarnfoundry-render = { workspace = true }
yarnfoundry-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow"] }
egui = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "Element", "Node", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Event", "EventTarget"] }
