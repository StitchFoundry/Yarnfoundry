<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>YarnFoundry: free colorwork charts for knitting and crochet</title>
  <meta name="description" content="Type a word or drop in a picture and get a colorwork chart sized to your gauge, with row-by-row instructions and a true-size printable chart. Free and open source, no account.">
  <!-- Favicon drawn here: a ball of yarn (original artwork). -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2a55'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e8b923'/%3E%3Cpath d='M9 13c5 2 9 2 14 0M8 18c6 3 10 3 16 0' stroke='%231f2a55' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #faf7f2; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; top: 40%; width: 100%; text-align: center; font: 18px sans-serif; color: #786f64; }
  </style>
</head>
<body>
  <div id="loading">Loading YarnFoundry...</div>
  <canvas id="yarnfoundry"></canvas>
  <script type="module">
    import init, { start } from "./pkg/yarnfoundry_web.js";
    await init();
    document.getElementById("loading").remove();
    await start("yarnfoundry");
  </script>
</body>
</html>
